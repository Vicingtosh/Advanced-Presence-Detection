name: Run tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Ruff
        run: python -m pip install ruff==0.15.21
      - name: Check code
        run: ruff check custom_components tests
      - name: Check formatting
        run: ruff format --check custom_components tests

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.3.1"
            test_plugin: "0.13.317"
          - homeassistant: "2026.6.4"
            test_plugin: "0.13.340"
          - homeassistant: "2026.7.2"
            test_plugin: "0.13.346"
    name: Tests (Home Assistant ${{ matrix.homeassistant }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: >-
          python -m pip install
          homeassistant==${{ matrix.homeassistant }}
          pytest-homeassistant-custom-component==${{ matrix.test_plugin }}
      - name: Run tests
        run: >-
          pytest -q
          --cov=custom_components.advanced_presence_detection
          --cov-report=term-missing
          --cov-fail-under=90
